<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (/^\/admin(?:\/|$)/.test(window.location.pathname)) {
        document.documentElement.classList.add("velo-admin-surface");
      }
    </script>
    <style>
      html,
      body,
      #root {
        background: #ffffff;
      }

      html.velo-admin-surface,
      html.velo-admin-surface body,
      html.velo-admin-surface #root {
        background: #ffffff !important;
        color-scheme: light;
      }
    </style>
    <title>Velo — Infraestrutura de vendas para aumentar suas receitas</title>
    <meta name="description" content="Crie sua loja, encontre produtos de fornecedores reais e publique automaticamente no Mercado Livre, Shopee e mais. Sem estoque, sem complicação.">
    <meta property="og:type" content="website" />
    <!--
      Favicon. O Google busca /favicon.ico na raiz do domínio, e é de lá que ele
      tira o ícone do resultado de busca — por isso o .ico existe e carrega a
      marca atual (a cesta azul), nos tamanhos 16, 32 e 48. O ?v= força os
      navegadores a largarem o ícone antigo, que fica em cache por muito tempo.
    -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      As fontes do Google deixaram de bloquear o primeiro desenho da tela.
      media="print" faz o navegador baixar sem esperar; o onload devolve para
      "all" assim que o arquivo chega. Num 4G de celular simples isso é a
      diferença entre ver o título em 1s ou esperar o CSS de 7 famílias.
      O texto aparece antes na fonte do sistema e troca quando a fonte chega.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@100..900&family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@200..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,500;1,600;1,700&family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@100..900&family=Hanken+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@200..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,500;1,600;1,700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    </noscript>
    <script>
      /*
        Só na landing: manda buscar a foto do topo antes mesmo de o JavaScript
        do app baixar e montar a página. É o maior elemento da primeira tela —
        quem chega do Instagram no 4G espera por ela.
        Fica dentro do if porque o index.html é o mesmo de todas as rotas: no
        painel essa foto não aparece e o download seria desperdício.
      */
      if (window.location.pathname === "/") {
        var fotoTopo = document.createElement("link");
        fotoTopo.rel = "preload";
        fotoTopo.as = "image";
        fotoTopo.type = "image/webp";
        fotoTopo.href = "/landing/pessoa-01-640.webp";
        fotoTopo.setAttribute(
          "imagesrcset",
          "/landing/pessoa-01-640.webp 640w, /landing/pessoa-01-960.webp 960w, /landing/pessoa-01-1280.webp 1280w, /landing/pessoa-01-1672.webp 1672w"
        );
        fotoTopo.setAttribute("imagesizes", "100vw");
        document.head.appendChild(fotoTopo);
      }
    </script>
    
    
    
    
    <meta property="og:title" content="Velo — Infraestrutura de vendas para aumentar suas receitas">
  <meta name="twitter:title" content="Velo — Infraestrutura de vendas para aumentar suas receitas">
  <meta property="og:description" content="Crie sua loja, encontre produtos de fornecedores reais e publique automaticamente no Mercado Livre, Shopee e mais. Sem estoque, sem complicação.">
  <meta name="twitter:description" content="Crie sua loja, encontre produtos de fornecedores reais e publique automaticamente no Mercado Livre, Shopee e mais. Sem estoque, sem complicação.">
  <meta property="og:image" content="https://velods.com.br/og-image.png">
  <meta name="twitter:image" content="https://velods.com.br/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
</head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
