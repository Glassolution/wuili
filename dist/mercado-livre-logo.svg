<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo amarelo -->
  <rect width="400" height="400" fill="#FFE600"/>
  
  <!-- Círculo oval -->
  <ellipse cx="200" cy="200" rx="150" ry="100" fill="none" stroke="#2E3192" stroke-width="8"/>
  
  <!-- Aperto de mãos -->
  <g transform="translate(200, 200)">
    <!-- Mão esquerda -->
    <path d="M-60 -20 Q-80 -30 -90 -10 Q-85 10 -60 20 L-20 0 Z" fill="white" stroke="#2E3192" stroke-width="4"/>
    <!-- Mão direita -->
    <path d="M60 -20 Q80 -30 90 -10 Q85 10 60 20 L20 0 Z" fill="white" stroke="#2E3192" stroke-width="4"/>
    <!-- Conexão das mãos -->
    <path d="M-20 0 Q0 -10 20 0 Q0 10 -20 0" fill="white" stroke="#2E3192" stroke-width="4"/>
  </g>
</svg>